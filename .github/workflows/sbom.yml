name: SBOM

# Publication d'une release : événement volontaire et daté, contrairement à un
# push sur main qui remonterait des inventaires pour du code jamais déployé.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # cyclonedx-npm s'appuie sur `npm ls` : l'arbre doit être réellement
      # installé, le package-lock.json seul ne suffit pas.
      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Générer et envoyer les SBOM
        run: ./scripts/generate-sbom.sh --envoi
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          APP_VERSION: ${{ github.event.release.tag_name || github.ref_name }}

      # Utile en cas de litige sur ce qui a été envoyé, et le seul moyen de
      # relire un SBOM sans rejouer le job.
      - name: Conserver les SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.cdx.json
